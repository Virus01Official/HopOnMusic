{% extends "base.html" %}

{% block title %}Create Playlist{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-success fw-bold mb-4">
        <i class="fas fa-folder-plus"></i> Create New Playlist
    </h2>

    <form method="POST">
        <div class="mb-4">
            <label for="name" class="form-label">Playlist Name</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                class="form-control" 
                placeholder="Enter playlist name" 
                required>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-check"></i> Create
            </button>
            <a href="{{ url_for('my_playlists') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
